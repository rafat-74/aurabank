global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'auth-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['auth-service:8000']

  - job_name: 'accounts-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['accounts-service:8001']

  - job_name: 'transactions-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['transactions-service:8002']
