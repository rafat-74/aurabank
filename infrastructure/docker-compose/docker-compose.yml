networks:
  aurabank-auth-net:
    driver: bridge
  aurabank-accounts-net:
    driver: bridge
  aurabank-transactions-net:
    driver: bridge
  aurabank-gateway-net:
    driver: bridge

services:
  aurabank-auth-db:
    image: postgres:16-alpine
    container_name: aurabank-auth-db
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - aurabank_auth_db_data:/var/lib/postgresql/data
    networks:
      - aurabank-auth-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  aurabank-accounts-db:
    image: postgres:16-alpine
    container_name: aurabank-accounts-db
    environment:
      POSTGRES_DB: ${ACCOUNTS_DB_NAME}
      POSTGRES_USER: ${ACCOUNTS_DB_USER}
      POSTGRES_PASSWORD: ${ACCOUNTS_DB_PASSWORD}
    volumes:
      - aurabank_accounts_db_data:/var/lib/postgresql/data
    networks:
      - aurabank-accounts-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ACCOUNTS_DB_USER} -d ${ACCOUNTS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  aurabank-transactions-db:
    image: postgres:16-alpine
    container_name: aurabank-transactions-db
    environment:
      POSTGRES_DB: ${TX_DB_NAME}
      POSTGRES_USER: ${TX_DB_USER}
      POSTGRES_PASSWORD: ${TX_DB_PASSWORD}
    volumes:
      - aurabank_tx_db_data:/var/lib/postgresql/data
    networks:
      - aurabank-transactions-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TX_DB_USER} -d ${TX_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  aurabank-redis:
    image: redis:7.2-alpine
    container_name: aurabank-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    networks:
      - aurabank-auth-net
      - aurabank-accounts-net
      - aurabank-transactions-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  aurabank-auth-service:
    build:
      context: ../../backend/auth-service
      dockerfile: Dockerfile
    container_name: aurabank-auth-service
    networks:
      - aurabank-auth-net
      - aurabank-gateway-net
    depends_on:
      aurabank-auth-db:
        condition: service_healthy

  aurabank-accounts-service:
    build:
      context: ../../backend/accounts-service
      dockerfile: Dockerfile
    container_name: aurabank-accounts-service
    networks:
      - aurabank-accounts-net
      - aurabank-transactions-net
      - aurabank-gateway-net
    depends_on:
      aurabank-accounts-db:
        condition: service_healthy

  aurabank-transactions-service:
    build:
      context: ../../backend/transactions-service
      dockerfile: Dockerfile
    container_name: aurabank-transactions-service
    networks:
      - aurabank-transactions-net
      - aurabank-gateway-net
    depends_on:
      aurabank-transactions-db:
        condition: service_healthy
      aurabank-accounts-service:
        condition: service_started

  aurabank-api-gateway:
    image: nginx:1.25-alpine
    container_name: aurabank-api-gateway
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - aurabank-gateway-net
    depends_on:
      - aurabank-auth-service
      - aurabank-accounts-service
      - aurabank-transactions-service

volumes:
  aurabank_auth_db_data:
  aurabank_accounts_db_data:
  aurabank_tx_db_data:

  prometheus:
    image: prom/prometheus:latest
    container_name: aurabank-prometheus
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - aurabank-gateway-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: aurabank-grafana
    ports:
      - "3000:3000"
    networks:
      - aurabank-gateway-net
    restart: unless-stopped
